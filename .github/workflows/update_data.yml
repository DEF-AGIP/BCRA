name: Actualizar Datos BCRA

on:
  schedule:
    # Se ejecuta automáticamente de lunes a viernes a las 12:00 UTC (09:00 ART) y 21:00 UTC (18:00 ART)
    - cron: '0 12,21 * * 1-5'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Consultar API BCRA y actualizar JSON
        run: python fetch_data.py

      - name: Commit y Push de datos actualizados
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/bcra_data.json
          if ! git diff --cached --exit-code; then
            git commit -m "Auto-actualización diaria BCRA [skip ci]"
            git push
          else
            echo "Sin cambios en los datos del BCRA."
          fi
